name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: MyPy
        run: uv run mypy src tests

      - name: Start MiniStack
        run: |
          docker run -d \
            --name ministack \
            -p 4566:4566 \
            -e LOG_LEVEL=WARNING \
            ministackorg/ministack:latest

      - name: Wait for MiniStack
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:4566/_ministack/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs ministack
          exit 1

      - name: Pytest
        run: uv run pytest
