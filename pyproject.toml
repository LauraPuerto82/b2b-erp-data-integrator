[project]
name = "b2b-erp-data-integrator"
version = "0.1.0"
description = "Extensible B2B data integration platform for normalizing heterogeneous ERP data into canonical models."
readme = "README.md"
authors = [
    { name = "Laura", email = "laura.puerto.martin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
